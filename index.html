<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier Banners</title>
<style>
  :root { --bg: #0b0b0d; --fg: #ededeb; --muted: #8a8d93; --line: #24242a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 24px; }
  a.card { display: block; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  a.card img { display: block; width: 100%; height: auto; }
  a.card span { display: block; padding: 10px 14px; }
</style>
</head>
<body>
<main>
  <h1>Outlier banners</h1>
  <p>Animated banner variants for the store. Click one to open it.</p>
  <a class="card" href="banners/01-smoke-glow/"><img src="banners/01-smoke-glow/bg.jpg" alt=""><span>01 · Red / blue glow — 16:9</span></a>
  <a class="card" href="banners/02-sequence/"><img src="banners/02-sequence/bg.jpg" alt=""><span>02 · Suppressors reveal</span></a>
  <a class="card" href="banners/03-roll-in/"><img src="banners/03-roll-in/poster.jpg" alt=""><span>03 · Roll-in from the dark</span></a>
  <a class="card" href="banners/04-wet-stone/"><img src="banners/04-wet-stone/bg.jpg" alt=""><span>04 · Wet stone — glints and a beam of light</span></a>
  <a class="card" href="banners/05-camera/"><img src="banners/05-camera/bg.jpg" alt=""><span>05 · Camera glide over the suppressors</span></a>
  <a class="card" href="banners/06-3d-flyby/"><img src="banners/06-3d-flyby/poster.jpg" alt=""><span>06 · 3D flyby (animated WebP / GIF)</span></a>
</main>
</body>
</html>
