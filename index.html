<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier Banners</title>
<style>
  :root { --bg: #0b0b0d; --fg: #ededeb; --muted: #8a8d93; --line: #24242a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 24px; }
  a.card { display: block; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  a.card img { display: block; width: 100%; height: auto; }
  a.card span { display: block; padding: 10px 14px; }
</style>
</head>
<body>
<main>
  <h1>Outlier banners</h1>
  <p>Animated banner variants for the store. Click one to open it.</p>
  <a class="card" href="banners/01-smoke-glow/"><img src="banners/01-smoke-glow/bg.jpg" alt=""><span>01 · Smoke glow — blue and red smoke</span></a>
</main>
</body>
</html>
