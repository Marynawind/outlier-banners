<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backdraft Landing Preview</title>
<style>html,body{margin:0;background:#000}</style></head><body>
<!-- OUTLIER → BACKDRAFT LANDING (paste into an Ecwid "Custom code" section) -->
<style>
  .bdl { position: relative; display: block; width: 100%; max-width: 1600px; margin: 0 auto; aspect-ratio: 16 / 9;
    overflow: hidden; background: #000; color: #fff; text-decoration: none; cursor: pointer; }
  .bdl-cam { position: absolute; inset: 0; transform-origin: 68% 40%; animation: bdl-zoom 25.6s linear infinite; will-change: transform; }
  .bdl-cam > span { position: absolute; inset: 0; background-position: center; background-size: cover; background-repeat: no-repeat; }
  .bdl-dark { background-image: url(https://marynawind.github.io/outlier-banners/banners/02-sequence/bg-dark.jpg); }
  .bdl-floor { background-image: url(https://marynawind.github.io/outlier-banners/banners/02-sequence/bg.jpg); opacity: 0; animation: bdl-floor 1.6s ease-in-out 4.7s forwards; }
  .bdl-lit { background-image: url(https://marynawind.github.io/outlier-banners/banners/02-sequence/bg.jpg);
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%, transparent 100%);
    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: bdl-reveal 6.4s linear infinite; }
  @keyframes bdl-reveal {
    0%   { -webkit-mask-position: 52% 0; mask-position: 52% 0; opacity: 1; animation-timing-function: cubic-bezier(.3,0,.5,1); }
    74%  { -webkit-mask-position: 24% 0; mask-position: 24% 0; opacity: 1; }
    98%  { -webkit-mask-position: 24% 0; mask-position: 24% 0; opacity: 0; }
    98.1%, 100% { -webkit-mask-position: 52% 0; mask-position: 52% 0; opacity: 0; } }
  @keyframes bdl-floor { to { opacity: .35; } }
  @keyframes bdl-zoom {
    0% { transform: scale(1.00); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    23% { transform: scale(1.05); animation-timing-function: linear; } 25% { transform: scale(1.05); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    48% { transform: scale(1.10); animation-timing-function: linear; } 50% { transform: scale(1.10); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    73% { transform: scale(1.15); animation-timing-function: linear; } 75% { transform: scale(1.15); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    93.5% { transform: scale(1.20); animation-timing-function: linear; } 96.9% { transform: scale(1.20); } 97%, 100% { transform: scale(1.00); } }
  .bdl-black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; animation: bdl-black 25.6s linear infinite; }
  @keyframes bdl-black { 0%, 93.5% { opacity: 0; } 96.5%, 97.5% { opacity: 1; } 100% { opacity: 0; } }
  .bdl-cta { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .bdl-btn { display: inline-block; padding: 14px 40px; border: 0; border-radius: 3px; background: #b27b29;
    font: 700 clamp(14px, 1.6vw, 20px)/1 "Roboto Condensed", Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #fff;
    transition: background .2s; }
  .bdl:hover .bdl-btn, .bdl:focus-visible .bdl-btn { background: #946620; }
  @media (prefers-reduced-motion: reduce) { .bdl-cam, .bdl-lit, .bdl-floor, .bdl-black { animation: none; } .bdl-lit { -webkit-mask: none; mask: none; } }
</style>
<a class="bdl" id="bdl" href="https://backdraftsuppressors.com/" aria-label="Shop suppressors at Backdraft Suppressors">
  <span class="bdl-cam"><span class="bdl-dark"></span><span class="bdl-floor"></span><span class="bdl-lit"></span></span>
  <span class="bdl-black"></span>
  <span class="bdl-cta"><span class="bdl-btn">Shop Now</span></span>
</a>
<script>
(function () {
  var URL = 'https://backdraftsuppressors.com/suppressors/';
  var SECONDS = 7;                       /* auto-redirect delay: one full reveal of the animation */
  var left = SECONDS;
  function tick() {
    if (left <= 0) { window.location.href = URL; return; }
    left--; setTimeout(tick, 1000);
  }
  tick();
})();
</script>
<!-- END OUTLIER → BACKDRAFT LANDING -->

</body></html>
