<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade Slide Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f4f4; --fg: #333; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .note { max-width: 1200px; margin: 0 auto; padding: 16px; font-size: 14px; color: #555; }
  /* preview of the BigCommerce Cornerstone hero slide (same font, overlay box and outlined button as the live site) */
  .slide { position: relative; display: block; width: 100%; color: inherit; text-decoration: none; aspect-ratio: 16 / 9; background: #000 url(upgrade-suppressor-1920x1080.jpg?v=4) center / cover no-repeat; }
  .content { position: absolute; left: 8.33%; top: 50%; transform: translateY(-50%); max-width: none; padding: 30px 32px 36px; box-sizing: border-box; width: 59.8%;
    background: rgba(0,0,0,.4); }
  .title { margin: 0 0 30px; font: 700 clamp(22px, 3.33vw, 48px)/1.2 Barlow, sans-serif; text-transform: uppercase; color: #fff; }
  .btn { display: inline-block; padding: 13px 38px; border: 1px solid #fff; color: #fff; font: 700 15px/1 "Roboto Condensed", sans-serif;
    text-transform: uppercase; text-decoration: none; letter-spacing: .02em; }
  /* phones: the theme puts the text under the picture on white */
  @media (max-width: 700px) {
    .content { position: static; transform: none; width: auto; max-width: none; background: #fff; padding: 24px 16px; }
    .slide { display: flex; flex-direction: column; aspect-ratio: auto; background: none; }
    .slide::before { content: ""; display: block; aspect-ratio: 16 / 9; background: #000 url(upgrade-suppressor-1920x1080.jpg?v=4) center / cover no-repeat; }
    .title { color: #4e4e4e; font-size: 32px; }
    .btn { color: #454545; border-color: #454545; }
  }
</style>
</head>
<body>
  <a class="slide" href="https://backdraftsuppressors.com/shop-all/" aria-label="Upgrade your setup with a suppressor — Shop Now">
    <div class="content"><p class="title">Upgrade your setup with a suppressor</p><span class="btn">Shop Now</span></div>
  </a>
  <p class="note">Preview only. On the live site the heading and the Shop Now button are added by the theme over <code>upgrade-suppressor-1920x1080.jpg</code>.</p>
</body>
</html>
