<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Glide Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     A slow camera glides over the photo: flutes -> logo -> rings -> the standing suppressor, rising up it ->
     pull back to the whole scene -> back in to the start. The warm backlight breathes. No text. CSS only. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .ol-cam { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform;
    animation: ol-cam 22s cubic-bezier(.45,0,.55,1) infinite; }
  .ol-cam > span { position: absolute; inset: 0; background: url(bg.jpg) center / cover no-repeat; }
  .ol-warm { mix-blend-mode: screen; filter: saturate(1.3) brightness(1.2); opacity: 0;
    -webkit-mask: url(warm.png) center / 100% 100% no-repeat; mask: url(warm.png) center / 100% 100% no-repeat;
    animation: ol-breathe 5.5s ease-in-out infinite; }
  @keyframes ol-breathe { 0%, 100% { opacity: 0; } 50% { opacity: .75; } }
  @keyframes ol-cam {
    0% { transform: translate(0.00%,-68.80%) scale(2.2); }
    14% { transform: translate(-25.60%,-57.10%) scale(2.1); }
    28% { transform: translate(-56.40%,-39.30%) scale(1.9); }
    40% { transform: translate(-72.40%,-31.00%) scale(1.8); }
    52% { transform: translate(-100.00%,-78.00%) scale(2.0); }
    66% { transform: translate(-100.00%,-18.00%) scale(2.0); }
    76% { transform: translate(-90.00%,0.00%) scale(1.9); }
    90% { transform: translate(0.00%,0.00%) scale(1.0); }
    100% { transform: translate(0.00%,-68.80%) scale(2.2); } }
  @media (prefers-reduced-motion: reduce) { .ol-cam, .ol-warm { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-cam"><span></span><span class="ol-warm"></span></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
