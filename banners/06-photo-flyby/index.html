<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Flyby Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; --muted: #8a8d93; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }
  .ol-banner { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .ol-banner video { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: upload flyby.mp4 and poster.jpg to BigCommerce and use this <video> -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors"><video src="flyby.mp4?v=4" poster="poster.jpg?v=4" autoplay muted loop playsinline></video></a>
  <!-- BANNER END -->
</div>
</body>
</html>
