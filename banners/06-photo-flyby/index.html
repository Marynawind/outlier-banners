<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Flyby Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; --muted: #8a8d93; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }
  .ol-banner { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .ol-banner img { display: block; width: 100%; height: 100%; object-fit: cover; }
  h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 28px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: upload flyby.webp to BigCommerce and use this <img> -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors"><img src="flyby.webp" alt="Outlier suppressors"></a>
  <!-- BANNER END -->
  <h2>GIF version (fallback, 560 px)</h2>
  <a class="ol-banner" href="#" aria-label="Outlier suppressors"><img src="flyby.gif" alt="Outlier suppressors"></a>
</div>
</body>
</html>
