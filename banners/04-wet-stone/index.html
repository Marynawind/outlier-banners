<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Stone Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     Glints on the wet stone shimmer in three zones; soft diffused patches of warm light drift and overlap, lighting the suppressors and the wet stone.
     Light colour taken from the photo's warm rim light. CSS only. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-banner > span { position: absolute; inset: 0; pointer-events: none;
    background-image: url(bg.jpg); background-size: cover; background-position: center; mix-blend-mode: screen; opacity: 0; }
  .ol-banner > span.ol-glint { background: #ffcf96; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }
  .g1 { --m: url(glint1.png); animation: ol-sparkle 7.4s ease-in-out infinite; }
  .g2 { --m: url(glint2.png); animation: ol-sparkle 8.6s ease-in-out -1.6s infinite; }
  .g3 { --m: url(glint3.png); animation: ol-sparkle 6.8s ease-in-out -0.8s infinite; }
  @keyframes ol-sparkle { 0%, 100% { opacity: 0; } 30% { opacity: .75; } 50% { opacity: .35; } 70% { opacity: .9; } }
  /* diffused play of light: large soft patches of warm light drift slowly and overlap,
     brightening the suppressors and the wet stone where they pass; a very faint glow in the air. */
  .ol-banner > span.ol-light { opacity: 1; background: none; mix-blend-mode: screen; }
  .ol-banner > span.ol-light.hit { opacity: .45; -webkit-mask: url(lit.png) center / 100% 100% no-repeat; mask: url(lit.png) center / 100% 100% no-repeat; }
  .ol-light > i { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,200,140,.95), rgba(255,170,100,.45) 45%, rgba(255,150,80,0) 100%);
    filter: blur(30px); transform: translate(-50%,-50%);
    animation: ol-drift var(--d) ease-in-out var(--dl) infinite alternate, ol-breathe var(--f) ease-in-out var(--dl) infinite; }
  .ol-light > i:nth-child(1) { --x: 22%; --y: 45%; --s: 38vw; --d: 22s; --f: 11s;  --dl: 0s;   --mx: 14vw;  --my: 4vw; }
  .ol-light > i:nth-child(2) { --x: 55%; --y: 60%; --s: 30vw; --d: 28s; --f: 15s;  --dl: -6s;  --mx: -12vw; --my: -3vw; }
  .ol-light > i:nth-child(3) { --x: 82%; --y: 42%; --s: 34vw; --d: 25s; --f: 13s;  --dl: -3s;  --mx: -16vw; --my: 5vw; }
  .ol-light > i:nth-child(4) { --x: 40%; --y: 80%; --s: 26vw; --d: 32s; --f: 10s;  --dl: -9s;  --mx: 18vw;  --my: -4vw; }
  @keyframes ol-drift   { from { transform: translate(-50%,-50%); } to { transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))); } }
  @keyframes ol-breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* suppressors keep the photo's look; only their own highlights (rim light, ring edges) sparkle like sun glints */
  .ol-banner > span.ol-shine { background-image: url(bg.jpg); filter: brightness(1.9); mix-blend-mode: screen;
    -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }
  .s1 { --m: url(shine1.png); animation: ol-sparkle 9.2s ease-in-out -1s infinite; }
  .s2 { --m: url(shine2.png); animation: ol-sparkle 10.4s ease-in-out -3s infinite; }
  .s3 { --m: url(shine3.png); animation: ol-sparkle 8.2s ease-in-out -2s infinite; }
  @media (prefers-reduced-motion: reduce) { .ol-banner > span, .ol-light > i { animation: none; } .ol-banner > span.ol-glint { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-glint g1"></span><span class="ol-glint g2"></span><span class="ol-glint g3"></span>
    <span class="ol-light hit"><i></i><i></i><i></i><i></i></span>
    <span class="ol-shine s1"></span><span class="ol-shine s2"></span><span class="ol-shine s3"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
