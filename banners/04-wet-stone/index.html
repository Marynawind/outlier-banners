<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Stone Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     Glints on the wet stone shimmer in three zones; soft diffused patches of warm light drift and overlap, lighting the suppressors and the wet stone.
     Light colour taken from the photo's warm rim light. CSS only. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-banner > span { position: absolute; inset: 0; pointer-events: none;
    background-image: url(bg.jpg); background-size: cover; background-position: center; mix-blend-mode: screen; opacity: 0; }
  /* water-like sparkle: the photo's own bright specks on the wet stone twinkle in 8 independent groups */
  .ol-banner > span.ol-tw { filter: brightness(3.4); -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    animation: ol-twinkle var(--d) ease-in-out var(--dl) infinite; }
  .t1 { --m: url(tw1.png); --d: 6.2s; --dl: 0.0s; }    .t2 { --m: url(tw2.png); --d: 8.6s; --dl: -2.4s; }
  .t3 { --m: url(tw3.png); --d: 7.4s; --dl: -5.0s; } .t4 { --m: url(tw4.png); --d: 10.2s; --dl: -1.2s; }
  .t5 { --m: url(tw5.png); --d: 5.8s; --dl: -3.8s; } .t6 { --m: url(tw6.png); --d: 9.4s; --dl: -6.6s; }
  .t7 { --m: url(tw7.png); --d: 6.8s; --dl: -4.4s; } .t8 { --m: url(tw8.png); --d: 11.2s; --dl: -8.2s; }
  /* the photo's own copper rim light slowly brightens as a soft glow travels along it (no added shapes) */
  .ol-banner > span.ol-rim { filter: saturate(1.5) brightness(1.2); mix-blend-mode: normal; opacity: 1;
    -webkit-mask-image: url(rim.png), linear-gradient(90deg, transparent 0%, transparent 40%, #000 50%, transparent 60%, transparent 100%);
            mask-image: url(rim.png), linear-gradient(90deg, transparent 0%, transparent 40%, #000 50%, transparent 60%, transparent 100%);
    -webkit-mask-size: 100% 100%, 300% 100%; mask-size: 100% 100%, 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-composite: source-in; mask-composite: intersect;
    animation: ol-rim 6s ease-in-out infinite alternate; }
  /* the whole top highlight gently breathes */
  .ol-banner > span.ol-rimglow { filter: saturate(1.4) brightness(1.1); mix-blend-mode: normal; -webkit-mask: url(rim.png) center / 100% 100% no-repeat; mask: url(rim.png) center / 100% 100% no-repeat;
    animation: ol-breathe2 5s ease-in-out infinite; }
  @keyframes ol-breathe2 { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  /* light dip of the highlight in between */
  .ol-banner > span.ol-rimdark { background: #000; -webkit-mask: url(rim.png) center / 100% 100% no-repeat; mask: url(rim.png) center / 100% 100% no-repeat;
    animation: ol-dim2 5s ease-in-out infinite; }
  @keyframes ol-dim2 { 0%, 100% { opacity: .6; } 40%, 60% { opacity: 0; } }
  @keyframes ol-rim { from { -webkit-mask-position: 0 0, 100% 0; mask-position: 0 0, 100% 0; } to { -webkit-mask-position: 0 0, 0% 0; mask-position: 0 0, 0% 0; } }
  /* the lower edge of the top highlight softly spreads down the body and draws back (light spilling) */
  .ol-spill { position: absolute; inset: 0; pointer-events: none; background: url(spill.png) center / 100% 100% no-repeat;
    mix-blend-mode: screen; opacity: 0; animation: ol-spill 6s ease-in-out infinite;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 40%, transparent 60%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 40%, transparent 60%, transparent 100%);
    -webkit-mask-size: 100% 300%; mask-size: 100% 300%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  /* edge grows downward, holds, then fades (never shrinks back up) */
  @keyframes ol-spill {
    0%   { opacity: 0;  -webkit-mask-position: 0 100%; mask-position: 0 100%; }
    15%  { opacity: .55; }
    65%  { opacity: .55; -webkit-mask-position: 0 0%; mask-position: 0 0%; }
    85%  { opacity: .55; -webkit-mask-position: 0 0%; mask-position: 0 0%; }
    100% { opacity: 0;  -webkit-mask-position: 0 0%; mask-position: 0 0%; } }
  @keyframes ol-twinkle { 0%, 100% { opacity: 0; } 25% { opacity: .2; } 45% { opacity: 1; } 60% { opacity: .3; } 80% { opacity: .8; } }
  @keyframes ol-sparkle { 0%, 100% { opacity: .1; } 30% { opacity: 1; } 50% { opacity: .45; } 70% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ol-banner > span { animation: none; } .ol-banner > span.ol-tw, .ol-banner > span.ol-rim, .ol-banner > span.ol-rimglow, .ol-banner > span.ol-rimdark { opacity: 0; } .ol-banner > span.ol-glint { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-tw t1"></span><span class="ol-tw t2"></span><span class="ol-tw t3"></span><span class="ol-tw t4"></span>
    <span class="ol-tw t5"></span><span class="ol-tw t6"></span><span class="ol-tw t7"></span><span class="ol-tw t8"></span>
    <i class="ol-spill"></i><span class="ol-rimdark"></span><span class="ol-rimglow"></span><span class="ol-rim"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
