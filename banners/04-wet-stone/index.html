<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Stone Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     Glints on the wet stone shimmer in three zones; soft diffused patches of warm light drift and overlap, lighting the suppressors and the wet stone.
     Light colour taken from the photo's warm rim light. CSS only. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-banner > span { position: absolute; inset: 0; pointer-events: none;
    background-image: url(bg.jpg); background-size: cover; background-position: center; mix-blend-mode: screen; opacity: 0; }
  /* water-like sparkle: the photo's own bright specks on the wet stone twinkle in 8 independent groups */
  .ol-banner > span.ol-tw { filter: brightness(3.4); -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    animation: ol-twinkle var(--d) ease-in-out var(--dl) infinite; }
  .t1 { --m: url(tw1.png); --d: 6.2s; --dl: 0.0s; }    .t2 { --m: url(tw2.png); --d: 8.6s; --dl: -2.4s; }
  .t3 { --m: url(tw3.png); --d: 7.4s; --dl: -5.0s; } .t4 { --m: url(tw4.png); --d: 10.2s; --dl: -1.2s; }
  .t5 { --m: url(tw5.png); --d: 5.8s; --dl: -3.8s; } .t6 { --m: url(tw6.png); --d: 9.4s; --dl: -6.6s; }
  .t7 { --m: url(tw7.png); --d: 6.8s; --dl: -4.4s; } .t8 { --m: url(tw8.png); --d: 11.2s; --dl: -8.2s; }
  /* the copper top highlight slides over the curved body, as if the light source moved:
     a copy of the photo's own highlight glides down and back, the original spot dims as it leaves; clipped to the suppressors */
  .ol-banner > span.ol-hl { background: none; opacity: 1; mix-blend-mode: normal;
    -webkit-mask: url(objects.png) center / 100% 100% no-repeat; mask: url(objects.png) center / 100% 100% no-repeat; }
  .ol-hl > i { position: absolute; inset: 0; background: url(bg.jpg) center / cover no-repeat; filter: saturate(1.35) brightness(1.1) blur(1.2px);
    -webkit-mask: url(rim.png) center / 100% 100% no-repeat; mask: url(rim.png) center / 100% 100% no-repeat;
    animation: ol-slide 6s ease-in-out infinite alternate; will-change: transform; }
  @keyframes ol-slide { from { transform: translate(0,0); } to { transform: translate(0.25%, 0.9%); } }
  .ol-banner > span.ol-rimdark { background: #000; -webkit-mask: url(rim.png) center / 100% 100% no-repeat; mask: url(rim.png) center / 100% 100% no-repeat;
    animation: ol-dim3 6s ease-in-out infinite alternate; }
  @keyframes ol-dim3 { from { opacity: 0; } to { opacity: .65; } }
  @keyframes ol-twinkle { 0%, 100% { opacity: 0; } 25% { opacity: .2; } 45% { opacity: 1; } 60% { opacity: .3; } 80% { opacity: .8; } }
  @keyframes ol-sparkle { 0%, 100% { opacity: .1; } 30% { opacity: 1; } 50% { opacity: .45; } 70% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ol-banner > span { animation: none; } .ol-banner > span.ol-tw, .ol-banner > span.ol-rimdark { opacity: 0; } .ol-hl > i { animation: none; } .ol-banner > span.ol-glint { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-tw t1"></span><span class="ol-tw t2"></span><span class="ol-tw t3"></span><span class="ol-tw t4"></span>
    <span class="ol-tw t5"></span><span class="ol-tw t6"></span><span class="ol-tw t7"></span><span class="ol-tw t8"></span>
    <span class="ol-rimdark"></span><span class="ol-hl"><i></i></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
