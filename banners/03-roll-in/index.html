<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll-in Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     The suppressor rolls out of the dark and the smoke towards the viewer and stops in the photo's pose,
     then the 3D render dissolves into the real photo. 8.4 s loop, MP4. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .ol-banner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy into BigCommerce together with the <style> block above; upload roll-in.mp4 and poster.jpg via WebDAV /content/ -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressor">
    <video src="roll-in.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto"></video>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
