<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Smoke Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     Only the photo's own light: smoke, the wall spotlight around the logo and the suppressors' edges
     brighten and dim in an irregular rhythm; the smoke rolls and a low mist creeps over the floor. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-banner > span { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }
  .ol-lit   { background: url(bg.jpg) center / cover no-repeat; mix-blend-mode: screen; }
  .ol-shade { background: #000; }

  /* moving smoke (content moves inside a fixed mask; layers bleed past the frame so no edge shows) */
  .ol-banner > span.ol-move { overflow: hidden; }
  .ol-move > i { position: absolute; inset: -10%; background: url(smoke-tex.jpg) center / cover no-repeat; will-change: transform; }
  .ol-banner > span.m1 { --m: url(smoke.png); opacity: .7; }
  .m1 > i { transform-origin: 10% 55%; animation: ol-roll1 15s ease-in-out infinite alternate; }
  .ol-banner > span.m2 { --m: url(smoke.png); opacity: .5; }
  .m2 > i { transform-origin: 90% 55%; animation: ol-roll2 19s ease-in-out infinite alternate; }
  @keyframes ol-roll1 { from { transform: scale(1) translate(0,0); } to { transform: scale(1.35) translate(4%, -3%); } }
  @keyframes ol-roll2 { from { transform: scale(1.4) translate(-4%, 2%); } to { transform: scale(1) translate(0,0); } }
  .ol-banner > span.fl { --m: url(floor.png); opacity: .55; }
  .fl > i { top: 76%; bottom: 8%; left: -30%; right: -30%; background: url(floor-mist.png) center / 100% 100% no-repeat;
    animation: ol-creep 22s ease-in-out infinite alternate; }
  .ol-banner > span.fl2 { --m: url(floor.png); opacity: .35; }
  .fl2 > i { top: 78%; bottom: 7%; left: -30%; right: -30%; background: url(floor-mist.png) center / 100% 100% no-repeat;
    animation: ol-creep2 28s ease-in-out infinite alternate; }
  @keyframes ol-creep  { from { transform: translateX(-12%) scale(1); }   to { transform: translateX(12%) scale(1.2); } }
  @keyframes ol-creep2 { from { transform: translateX(9%) scale(1.15); }  to { transform: translateX(-9%) scale(1); } }

  /* glow zones */
  .z-s1 { --m: url(s1.png); } .z-s2 { --m: url(s2.png); } .z-s3 { --m: url(s3.png); }
  .z-s4 { --m: url(s4.png); } .z-s5 { --m: url(s5.png); }
  .z-s6 { --m: url(s6.png); } .z-s7 { --m: url(s7.png); } .z-obj { --m: url(objglow.png); }
  .z-halo { --m: url(halo.png); } .z-rim { --m: url(rim.png); }
  .ol-lit.z-s1 { animation: ol-flick-a 13.2s linear infinite; }
  .ol-lit.z-s2 { animation: ol-flick-b 18.5s linear -5.1s infinite; }
  .ol-lit.z-s3 { animation: ol-flick-c 15.8s linear -2.3s infinite; }
  .ol-lit.z-s4 { animation: ol-flick-b 16.8s linear -9.0s infinite; }
  .ol-lit.z-s5 { animation: ol-flick-a 20.1s linear -14.3s infinite; }
  .ol-shade.z-s1 { animation: ol-dip 14.2s linear -7.2s infinite; }
  .ol-shade.z-s2 { animation: ol-dip 12.5s linear -3.9s infinite; }
  .ol-shade.z-s4 { animation: ol-dip 13.2s linear -1.4s infinite; }
  .ol-shade.z-s5 { animation: ol-dip 17.5s linear -8.2s infinite; }
  .ol-lit.z-s6 { animation: ol-flick-c 14.6s linear -6.3s infinite; }
  .ol-lit.z-s7 { animation: ol-flick-a 17.2s linear -2.8s infinite; }
  .ol-shade.z-s3 { animation: ol-dip 15.4s linear -6.0s infinite; }
  .ol-shade.z-s6 { animation: ol-dip 11.9s linear -3.1s infinite; }
  /* soft glow of the suppressors themselves */
  .ol-lit.z-obj { animation: ol-breathe 9s ease-in-out infinite; }
  @keyframes ol-breathe { 0%, 100% { opacity: 0; } 50% { opacity: .22; } }
  .ol-lit.z-halo { animation: ol-flick-c 11.6s linear -4.0s infinite; }
  .ol-lit.z-rim  { animation: ol-flick-a 9.9s linear -0.9s infinite; }
  @keyframes ol-flick-a { 0% { opacity: 0.06; } 9% { opacity: 0.51; } 17% { opacity: 0.21; } 31% { opacity: 0.60; }
    44% { opacity: 0.12; } 58% { opacity: 0.42; } 71% { opacity: 0.09; } 86% { opacity: 0.54; } 100% { opacity: 0.06; } }
  @keyframes ol-flick-b { 0% { opacity: 0.30; } 14% { opacity: 0.03; } 27% { opacity: 0.54; } 36% { opacity: 0.24; }
    52% { opacity: 0.60; } 63% { opacity: 0.06; } 79% { opacity: 0.45; } 91% { opacity: 0.15; } 100% { opacity: 0.30; } }
  @keyframes ol-flick-c { 0% { opacity: 0.18; } 11% { opacity: 0.60; } 23% { opacity: 0.06; } 40% { opacity: 0.39; }
    49% { opacity: 0.12; } 66% { opacity: 0.57; } 77% { opacity: 0.18; } 88% { opacity: 0.36; } 100% { opacity: 0.18; } }
  @keyframes ol-dip { 0%, 100% { opacity: 0; } 18% { opacity: .75; } 30% { opacity: .15; } 52% { opacity: .8; } 68% { opacity: 0; } 84% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .ol-banner > span, .ol-move > i { animation: none !important; } .ol-banner > span:not(.ol-move) { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-move m1"><i></i></span><span class="ol-move m2"><i></i></span>
    <span class="ol-move fl"><i></i></span><span class="ol-move fl2"><i></i></span>
    <span class="ol-shade z-s1"></span><span class="ol-shade z-s2"></span><span class="ol-shade z-s3"></span><span class="ol-shade z-s4"></span><span class="ol-shade z-s5"></span><span class="ol-shade z-s6"></span>
    <span class="ol-lit z-s1"></span><span class="ol-lit z-s2"></span><span class="ol-lit z-s3"></span>
    <span class="ol-lit z-s4"></span><span class="ol-lit z-s5"></span><span class="ol-lit z-s6"></span><span class="ol-lit z-s7"></span>
    <span class="ol-lit z-obj"></span><span class="ol-lit z-halo"></span><span class="ol-lit z-rim"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
