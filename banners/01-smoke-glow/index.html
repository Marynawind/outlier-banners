<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Flow Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; --muted: #8a8d93; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 ===== */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  /* slow red <-> blue colour flow over the smoke, floor and rim light (logo stays white) */
  .ol-flow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color;
    background: linear-gradient(90deg,
      #1e4dff 0%, #6a2cff 12%, #ff2236 25%, #6a2cff 38%, #1e4dff 50%,
      #6a2cff 62%, #ff2236 75%, #6a2cff 88%, #1e4dff 100%);
    background-size: 200% 100%;
    -webkit-mask: url(color-mask.png) center / 100% 100% no-repeat;
            mask: url(color-mask.png) center / 100% 100% no-repeat;
    animation: ol-flow 24s linear infinite; }
  @keyframes ol-flow { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .ol-flow { animation: none; opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-flow"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
