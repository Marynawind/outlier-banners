<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Blue Glow Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 ===== */
  /* No new colours: the photo's own red and blue light is slowly brightened and dimmed. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-lit, .ol-shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  /* brighter: the same photo on top in screen mode, only where its blue / red light is */
  .ol-lit { background: url(bg.jpg) center / cover no-repeat; mix-blend-mode: screen; }
  /* darker: black over the same areas */
  .ol-shade { background: #000; }
  .ol-blue { -webkit-mask: url(blue-mask.png) center / 100% 100% no-repeat; mask: url(blue-mask.png) center / 100% 100% no-repeat; }
  .ol-red  { -webkit-mask: url(red-mask.png)  center / 100% 100% no-repeat; mask: url(red-mask.png)  center / 100% 100% no-repeat; }
  /* blue brightens while red dims, then the other way round */
  .ol-lit.ol-blue   { animation: ol-up   10s ease-in-out infinite; }
  .ol-shade.ol-blue { animation: ol-down 10s ease-in-out infinite; }
  .ol-lit.ol-red    { animation: ol-up   10s ease-in-out -5s infinite; }
  .ol-shade.ol-red  { animation: ol-down 10s ease-in-out -5s infinite; }
  @keyframes ol-up   { 0%, 100% { opacity: 0; }   50% { opacity: .9; } }
  @keyframes ol-down { 0%, 100% { opacity: .45; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ol-lit, .ol-shade { animation: none; opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-shade ol-blue"></span>
    <span class="ol-shade ol-red"></span>
    <span class="ol-lit ol-blue"></span>
    <span class="ol-lit ol-red"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
