<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Blue Glow Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     No new colours: the photo's own red and blue light brightens and dims.
     Each zone has its own irregular rhythm, so the glow looks chaotic and never repeats in sync. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    background: #000 url(bg.jpg) center / cover no-repeat; }
  .ol-banner > span { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }
  .ol-lit   { background: url(bg.jpg) center / cover no-repeat; mix-blend-mode: screen; }
  .ol-shade { background: #000; }

  /* moving smoke: outer layer keeps a fixed mask (smoke area only), the inner copy of the photo's
     own smoke zooms and slides inside it, so the clouds visibly roll closer / farther.
     Only the photo's own pixels are used, so no colour or saturation is added. */
  .ol-move { overflow: hidden; }
  .ol-move > i { position: absolute; inset: -10%; background: url(smoke-tex.jpg) center / cover no-repeat;
    will-change: transform; }
  .ol-move.m1 { --m: url(smoke.png); opacity: .7; }
  .ol-move.m1 > i { transform-origin: 10% 45%; animation: ol-roll1 15s ease-in-out infinite alternate; }
  .ol-move.m2 { --m: url(smoke.png); opacity: .5; }
  .ol-move.m2 > i { transform-origin: 90% 45%; animation: ol-roll2 19s ease-in-out infinite alternate; }
  @keyframes ol-roll1 { from { transform: scale(1) translate(0,0); } to { transform: scale(1.35) translate(4%, -3%); } }
  @keyframes ol-roll2 { from { transform: scale(1.4) translate(-4%, 2%); } to { transform: scale(1) translate(0,0); } }
  /* low mist creeping across the floor */
  .ol-move.fl { --m: url(floor.png); opacity: .75; }
  .ol-move.fl > i { top: 66%; bottom: -4%; left: -30%; right: -30%; background: url(floor-mist.png) center / 100% 100% no-repeat;
    animation: ol-creep 22s ease-in-out infinite alternate; }
  .ol-move.fl2 { --m: url(floor.png); opacity: .5; }
  .ol-move.fl2 > i { top: 70%; bottom: -6%; left: -30%; right: -30%; background: url(floor-mist.png) center / 100% 100% no-repeat;
    animation: ol-creep2 28s ease-in-out infinite alternate; }
  @keyframes ol-creep  { from { transform: translateX(-12%) scale(1); }    to { transform: translateX(12%) scale(1.2); } }
  @keyframes ol-creep2 { from { transform: translateX(9%) scale(1.15); } to { transform: translateX(-9%) scale(1); } }
  /* calmer blue smoke at the top: fixed darkening, applied on top of all motion */
  .ol-banner > span.ol-calm { background: #000; opacity: .45; animation: none; --m: url(top-blue.png); }
  .z-b1 { --m: url(b1.png); } .z-b2 { --m: url(b2.png); } .z-b3 { --m: url(b3.png); }
  .z-r1 { --m: url(r1.png); } .z-r2 { --m: url(r2.png); } .z-r3 { --m: url(r3.png); }
  .z-ob { --m: url(ob.png); } .z-or { --m: url(or.png); }

  /* background smoke: different speeds and offsets */
  .ol-lit.z-b1 { animation: ol-flick-a 8.8s linear infinite; }
  .ol-lit.z-b2 { animation: ol-flick-b 12.3s linear -3.4s infinite; }
  .ol-lit.z-b3 { animation: ol-flick-c 7.7s linear -1.7s infinite; }
  .ol-lit.z-r1 { animation: ol-flick-b 10.5s linear -6.0s infinite; }
  .ol-lit.z-r2 { animation: ol-flick-c 8.3s linear -1.2s infinite; }
  .ol-lit.z-r3 { animation: ol-flick-a 13.4s linear -9.5s infinite; }
  .ol-shade.z-b1 { animation: ol-dip 9.5s linear -4.8s infinite; }
  .ol-shade.z-b2 { animation: ol-dip 8.3s linear -2.6s infinite; }
  .ol-shade.z-b3 { animation: ol-dip 11.2s linear -6.9s infinite; }
  .ol-shade.z-r1 { animation: ol-dip 8.8s linear -0.9s infinite; }
  .ol-shade.z-r2 { animation: ol-dip 11.7s linear -5.5s infinite; }
  .ol-shade.z-r3 { animation: ol-dip 7.7s linear -3.4s infinite; }
  /* our suppressors: their blue / red rim light flares with the same chaos */
  .ol-lit.z-ob { animation: ol-flick-c 6.6s linear -3.1s infinite; }
  .ol-lit.z-or { animation: ol-flick-a 7.4s linear -0.5s infinite; }

  @keyframes ol-flick-a { 0% { opacity: 0.06; } 9% { opacity: 0.51; } 17% { opacity: 0.21; } 31% { opacity: 0.60; }
    44% { opacity: 0.12; } 58% { opacity: 0.42; } 71% { opacity: 0.09; } 86% { opacity: 0.54; } 100% { opacity: 0.06; } }
  @keyframes ol-flick-b { 0% { opacity: 0.30; } 14% { opacity: 0.03; } 27% { opacity: 0.54; } 36% { opacity: 0.24; }
    52% { opacity: 0.60; } 63% { opacity: 0.06; } 79% { opacity: 0.45; } 91% { opacity: 0.15; } 100% { opacity: 0.30; } }
  @keyframes ol-flick-c { 0% { opacity: 0.18; } 11% { opacity: 0.60; } 23% { opacity: 0.06; } 40% { opacity: 0.39; }
    49% { opacity: 0.12; } 66% { opacity: 0.57; } 77% { opacity: 0.18; } 88% { opacity: 0.36; } 100% { opacity: 0.18; } }
  @keyframes ol-dip { 0%, 100% { opacity: 0; } 18% { opacity: .75; } 30% { opacity: .15; } 52% { opacity: .8; } 68% { opacity: 0; } 84% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .ol-banner > span { animation: none !important; opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-move m1"><i></i></span><span class="ol-move m2"><i></i></span>
    <span class="ol-move fl"><i></i></span><span class="ol-move fl2"><i></i></span>
    <span class="ol-shade z-b1"></span><span class="ol-shade z-b2"></span><span class="ol-shade z-b3"></span>
    <span class="ol-shade z-r1"></span><span class="ol-shade z-r2"></span><span class="ol-shade z-r3"></span>
    <span class="ol-lit z-b1"></span><span class="ol-lit z-b2"></span><span class="ol-lit z-b3"></span>
    <span class="ol-lit z-r1"></span><span class="ol-lit z-r2"></span><span class="ol-lit z-r3"></span>
    <span class="ol-lit z-ob"></span><span class="ol-lit z-or"></span>
    <span class="ol-calm"></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
