<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppressors Reveal Banner</title>
<style>
  :root { --bg: #050507; --fg: #ededeb; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 24px 16px; }

  /* ===== banner 16:9 =====
     Light sweeps smoothly from left to right and reveals the suppressors; the camera slowly zooms in.
     Only the photo's own pixels. 12 s loop, CSS only. */
  .ol-banner { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .ol-cam { position: absolute; inset: 0; transform-origin: 68% 58%; animation: ol-zoom 12s ease-in-out infinite; will-change: transform; }
  .ol-cam > span { position: absolute; inset: 0; background-position: center; background-size: cover; background-repeat: no-repeat; }
  .ol-dark { background-image: url(bg-dark.jpg); }
  .ol-lit  { background-image: url(bg.jpg);
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%, transparent 100%);
    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: ol-reveal 12s linear infinite; }
  /* reveal: soft light edge travels left -> right (0–55%), hold, then fade back to dark */
  @keyframes ol-reveal {
    0%      { -webkit-mask-position: 85% 0; mask-position: 85% 0; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.6,1); }
    55%     { -webkit-mask-position: 15% 0; mask-position: 15% 0; opacity: 1; }
    82%     { -webkit-mask-position: 15% 0; mask-position: 15% 0; opacity: 1; }
    96%     { -webkit-mask-position: 15% 0; mask-position: 15% 0; opacity: 0; }
    96.1%, 100% { -webkit-mask-position: 85% 0; mask-position: 85% 0; opacity: 0; } }
  /* light camera move: slow push-in, eased back while the scene is dark */
  @keyframes ol-zoom { 0% { transform: scale(1) translate(0,0); } 82% { transform: scale(1.07) translate(-1%, -0.5%); }
    100% { transform: scale(1) translate(0,0); } }
  @media (prefers-reduced-motion: reduce) { .ol-cam, .ol-lit { animation: none; } .ol-lit { -webkit-mask: none; mask: none; } }
</style>
</head>
<body>
<div class="wrap">
  <!-- BANNER START: copy from here into BigCommerce (together with the <style> block above) -->
  <a class="ol-banner" href="#" aria-label="Outlier suppressors">
    <span class="ol-cam"><span class="ol-dark"></span><span class="ol-lit"></span></span>
  </a>
  <!-- BANNER END -->
</div>
</body>
</html>
